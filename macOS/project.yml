name: KanbanClaude
options:
  bundleIdPrefix: com.kanbanclaude
  deploymentTarget:
    macOS: "13.3"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.3"
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    PRODUCT_BUNDLE_IDENTIFIER: com.kanbanclaude.kanbanclaude
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: 0
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
targets:
  KanbanClaude:
    type: application
    platform: macOS
    deploymentTarget: "13.3"
    sources:
      - path: KanbanClaude
        excludes:
          - "Info.plist"
          - "KanbanClaude.entitlements"
    info:
      path: KanbanClaude/Info.plist
      properties:
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "2"
        CFBundleDisplayName: SmartKanban
        CFBundleName: KanbanClaude
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: "13.3"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 KanbanClaude"
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        CFBundleURLTypes:
          - CFBundleURLName: com.kanbanclaude.auth
            CFBundleURLSchemes:
              - kanbanclaude
        UTExportedTypeDeclarations: []
        LSUIElement: false
    entitlements:
      path: KanbanClaude/KanbanClaude.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.network.server: false
        com.apple.security.files.user-selected.read-only: true
